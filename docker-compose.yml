services:
  web:
    build: .
    container_name: kisekae-web
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./staticfiles:/app/staticfiles
    depends_on:
      - redis
      - db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kisekae-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
  db:
    image: postgres:18-alpine
    container_name: kisekae-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql
    restart: unless-stopped

volumes:
  redis_data:
  db_data: