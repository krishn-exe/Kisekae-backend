services:
  web:
    build: .
    container_name: kisekae-web
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./staticfiles:/app/staticfiles
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: kisekae-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data: