<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="format-detection" content="telephone=no, address=no, email=no, date=no, url=no">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{% block title %}KISEKAE{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      supported-color-schemes: light dark;
    }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      min-width: 100% !important;
      height: 100% !important;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    body {
      background-color: #F4F0EB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #2D2527;
      line-height: 1.6;
    }
    table {
      border-spacing: 0;
      border-collapse: collapse;
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
    }
    img {
      -ms-interpolation-mode: bicubic;
      border: 0;
      outline: none;
      text-decoration: none;
      display: block;
      max-width: 100%;
      height: auto;
    }
    .wrapper {
      width: 100% !important;
      max-width: 100% !important;
      background-color: #F4F0EB;
      padding: 30px 12px;
      box-sizing: border-box;
      margin: 0 auto;
    }
    .container {
      width: 100% !important;
      max-width: 580px !important;
      margin: 0 auto;
      background-color: #FFFFFF;
      border-radius: 14px;
      border: 1px solid #E7E2DA;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(45, 37, 39, 0.05);
      box-sizing: border-box;
    }
    .header {
      padding: 28px 24px 20px 24px;
      text-align: center;
      background-color: #FFFFFF;
      border-bottom: 1px solid #F4F0EB;
      box-sizing: border-box;
    }
    .brand-title {
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #802B3E;
      margin: 0;
      text-transform: uppercase;
      line-height: 1.2;
    }
    .brand-tagline {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #78716C;
      text-transform: uppercase;
      margin-top: 6px;
    }
    .content {
      padding: 28px 24px;
      word-break: break-word;
      overflow-wrap: break-word;
      box-sizing: border-box;
    }
    .footer {
      padding: 20px 24px;
      background-color: #FAF8F5;
      border-top: 1px solid #E7E2DA;
      text-align: center;
      font-size: 12px;
      color: #78716C;
      box-sizing: border-box;
    }
    .footer a {
      color: #802B3E;
      text-decoration: none;
    }
    .btn {
      display: inline-block;
      background-color: #802B3E;
      color: #FFFFFF !important;
      padding: 13px 26px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      letter-spacing: 0.5px;
      margin-top: 15px;
      margin-bottom: 15px;
      text-align: center;
      max-width: 100%;
      box-sizing: border-box;
    }
    .badge {
      display: inline-block;
      background-color: #F9F4F5;
      color: #802B3E;
      border: 1px solid #EBD5D9;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .badge-success {
      background-color: #ECFDF5 !important;
      color: #047857 !important;
      border-color: #A7F3D0 !important;
    }
    .badge-danger {
      background-color: #FEF2F2 !important;
      color: #B91C1C !important;
      border-color: #FECACA !important;
    }
    .badge-warning {
      background-color: #FFFBEB !important;
      color: #92400E !important;
      border-color: #FDE68A !important;
    }
    .badge-info {
      background-color: #EFF6FF !important;
      color: #1D4ED8 !important;
      border-color: #BFDBFE !important;
    }
    .table-responsive {
      width: 100% !important;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 16px 0;
    }
    .item-table {
      width: 100% !important;
      border-collapse: collapse;
      table-layout: auto;
    }
    .item-table th {
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #78716C;
      padding-bottom: 8px;
      border-bottom: 1px solid #E7E2DA;
      white-space: nowrap;
    }
    .item-table td {
      padding: 12px 6px 12px 0;
      border-bottom: 1px solid #F4F0EB;
      font-size: 14px;
      vertical-align: top;
      word-break: break-word;
    }
    .info-card {
      background-color: #FAF8F5;
      border: 1px solid #EDE8E3;
      border-radius: 8px;
      padding: 16px;
      margin: 20px 0;
      box-sizing: border-box;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .info-card-success {
      border-left: 4px solid #059669 !important;
    }
    .info-card-danger {
      border-left: 4px solid #DC2626 !important;
    }
    .token-box {
      display: block;
      width: 100%;
      box-sizing: border-box;
      background-color: #FFFFFF;
      border: 1px solid #D5CDC5;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: Consolas, "Courier New", Courier, monospace;
      font-size: 16px;
      font-weight: 700;
      color: #802B3E;
      letter-spacing: 0.5px;
      word-break: break-all;
      overflow-wrap: anywhere;
      line-height: 1.4;
      text-align: center;
    }
    .otp-box {
      display: inline-block;
      max-width: 100%;
      box-sizing: border-box;
      background-color: #FAF8F5;
      border: 2px dashed #802B3E;
      border-radius: 12px;
      padding: 16px 28px;
      word-break: break-all;
    }

    /* Mobile Responsive Optimizations */
    @media only screen and (max-width: 600px) {
      .wrapper {
        padding: 8px 4px !important;
      }
      .container {
        border-radius: 8px !important;
        border-left: none !important;
        border-right: none !important;
      }
      .header {
        padding: 18px 14px 14px 14px !important;
      }
      .brand-title {
        font-size: 20px !important;
        letter-spacing: 2px !important;
      }
      .content {
        padding: 18px 14px !important;
      }
      .footer {
        padding: 16px 14px !important;
      }
      .btn {
        display: block !important;
        width: 100% !important;
        padding: 14px 16px !important;
        box-sizing: border-box !important;
      }
      .token-box {
        font-size: 13px !important;
        padding: 10px 8px !important;
      }
      .otp-box {
        padding: 12px 16px !important;
      }
      .otp-text {
        font-size: 24px !important;
        letter-spacing: 4px !important;
      }
      .item-table th, .item-table td {
        font-size: 12px !important;
        padding: 8px 3px !important;
      }
      .info-card {
        padding: 12px !important;
        margin: 14px 0 !important;
      }
      h2 {
        font-size: 19px !important;
      }
    }

    /* Dark Mode Adaptations for Modern Email Clients */
    @media (prefers-color-scheme: dark) {
      body, .wrapper {
        background-color: #121011 !important;
      }
      .container {
        background-color: #1E181A !important;
        border-color: #33272B !important;
      }
      .header {
        background-color: #1E181A !important;
        border-bottom-color: #33272B !important;
      }
      .footer {
        background-color: #161213 !important;
        border-top-color: #33272B !important;
        color: #A8A29E !important;
      }
      .brand-title {
        color: #E28294 !important;
      }
      .brand-tagline {
        color: #A8A29E !important;
      }
      .content {
        color: #EDE5DE !important;
      }
      h2, h3, strong, td, th {
        color: #EDE5DE !important;
      }
      .info-card {
        background-color: #272023 !important;
        border-color: #3A2F33 !important;
      }
      .token-box {
        background-color: #161213 !important;
        border-color: #4D3C42 !important;
        color: #E28294 !important;
      }
      .otp-box {
        background-color: #272023 !important;
        border-color: #E28294 !important;
      }
      .otp-text {
        color: #E28294 !important;
      }
      .badge {
        background-color: #351C23 !important;
        color: #E28294 !important;
        border-color: #522734 !important;
      }
      .badge-success {
        background-color: #064E3B !important;
        color: #6EE7B7 !important;
        border-color: #047857 !important;
      }
      .badge-danger {
        background-color: #450A0A !important;
        color: #FCA5A5 !important;
        border-color: #991B1B !important;
      }
      .badge-warning {
        background-color: #451A03 !important;
        color: #FCD34D !important;
        border-color: #92400E !important;
      }
      .badge-info {
        background-color: #172554 !important;
        color: #93C5FD !important;
        border-color: #1E40AF !important;
      }
      .item-table th {
        border-bottom-color: #3A2F33 !important;
        color: #A8A29E !important;
      }
      .item-table td {
        border-bottom-color: #272023 !important;
      }
      .btn {
        background-color: #9E354D !important;
        color: #FFFFFF !important;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <h1 class="brand-title">KISEKAE</h1>
        <div class="brand-tagline">Fashion, before it's yours</div>
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
      <div class="footer">
        <p style="margin: 0 0 6px 0;">KISEKAE Augmented Reality Fashion Store</p>
        <p style="margin: 0; font-size: 11px; color: #78716C;">You received this email because of your account activity on Kisekae.</p>
      </div>
    </div>
  </div>
</body>
</html>
