<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no, address=no, email=no, date=no, url=no">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{% block title %}KISEKAE{% endblock %}</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
  <style type="text/css">
    /* Core CSS Resets */
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    table, td {
      mso-table-lspace: 0pt;
      mso-table-rspace: 0pt;
      border-collapse: collapse;
    }
    img {
      -ms-interpolation-mode: bicubic;
      border: 0;
      height: auto;
      line-height: 100%;
      outline: none;
      text-decoration: none;
      display: block;
      max-width: 100%;
    }

    /* Mobile Responsive Optimizations */
    @media only screen and (max-width: 600px) {
      .email-wrapper-cell {
        padding: 8px 4px !important;
      }
      .email-container-table {
        width: 100% !important;
        max-width: 100% !important;
        border-radius: 8px !important;
      }
      .email-content-td {
        padding: 20px 14px !important;
      }
      .email-header-td {
        padding: 18px 14px 14px 14px !important;
      }
      .email-footer-td {
        padding: 14px 12px !important;
      }
      .brand-title {
        font-size: 20px !important;
        letter-spacing: 2px !important;
      }
      .btn-responsive {
        width: 100% !important;
        display: block !important;
        box-sizing: border-box !important;
        padding: 12px 14px !important;
      }
      .token-td {
        font-size: 13px !important;
        padding: 10px 6px !important;
        letter-spacing: 0.2px !important;
      }
      .otp-cell {
        padding: 10px 16px !important;
      }
      .otp-text {
        font-size: 24px !important;
        letter-spacing: 4px !important;
      }
      .item-table th, .item-table td {
        font-size: 12px !important;
        padding: 8px 2px !important;
      }
      .info-card {
        padding: 12px !important;
        margin: 14px 0 !important;
      }
      h2 {
        font-size: 19px !important;
      }
    }

    /* Dark Mode Adaptations for Modern Email Clients */
    @media (prefers-color-scheme: dark) {
      body, .email-body-bg {
        background-color: #121011 !important;
      }
      .email-container-table {
        background-color: #1E181A !important;
        border-color: #33272B !important;
      }
      .email-header-td {
        background-color: #1E181A !important;
        border-bottom-color: #33272B !important;
      }
      .email-content-td {
        color: #EDE5DE !important;
      }
      .email-footer-td {
        background-color: #161213 !important;
        border-top-color: #33272B !important;
        color: #A8A29E !important;
      }
      .brand-title {
        color: #E28294 !important;
      }
      .brand-tagline {
        color: #A8A29E !important;
      }
      h2, h3, strong, td, th {
        color: #EDE5DE !important;
      }
      .text-subtle {
        color: #A8A29E !important;
      }
      .text-dark {
        color: #EDE5DE !important;
      }
      .info-card {
        background-color: #272023 !important;
        border-color: #3A2F33 !important;
      }
      .token-table {
        background-color: #161213 !important;
        border-color: #4D3C42 !important;
      }
      .token-td {
        color: #E28294 !important;
      }
      .otp-cell {
        background-color: #272023 !important;
        border-color: #E28294 !important;
      }
      .otp-text {
        color: #E28294 !important;
      }
      .badge-default {
        background-color: #351C23 !important;
        color: #E28294 !important;
        border-color: #522734 !important;
      }
      .badge-success {
        background-color: #064E3B !important;
        color: #6EE7B7 !important;
        border-color: #047857 !important;
      }
      .badge-danger {
        background-color: #450A0A !important;
        color: #FCA5A5 !important;
        border-color: #991B1B !important;
      }
      .badge-warning {
        background-color: #451A03 !important;
        color: #FCD34D !important;
        border-color: #92400E !important;
      }
      .badge-info {
        background-color: #172554 !important;
        color: #93C5FD !important;
        border-color: #1E40AF !important;
      }
      .item-table th {
        border-bottom-color: #3A2F33 !important;
        color: #A8A29E !important;
      }
      .item-table td {
        border-bottom-color: #272023 !important;
      }
      .btn-cell {
        background-color: #9E354D !important;
      }
      .btn-responsive {
        background-color: #9E354D !important;
        color: #FFFFFF !important;
      }
      .divider-line {
        border-top-color: #3A2F33 !important;
      }
    }
  </style>
</head>
<body class="email-body-bg" style="margin: 0; padding: 0; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; background-color: #F4F0EB; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #2D2527;">
  <!-- Centering Outer Wrapper Table -->
  <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" class="email-body-bg" style="width: 100% !important; margin: 0; padding: 0; background-color: #F4F0EB;">
    <tr>
      <td align="center" valign="top" class="email-wrapper-cell" style="padding: 24px 10px; margin: 0;">
        <!--[if (gte mso 9)|(IE)]>
        <table align="center" border="0" cellspacing="0" cellpadding="0" width="580" style="width: 580px;">
        <tr>
        <td align="center" valign="top" width="580" style="width: 580px;">
        <![endif]-->
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" class="email-container-table" style="max-width: 580px; width: 100% !important; background-color: #FFFFFF; border: 1px solid #E7E2DA; border-radius: 12px; overflow: hidden; margin: 0 auto; border-collapse: separate; border-spacing: 0;">
          <!-- Header -->
          <tr>
            <td align="center" class="email-header-td" style="padding: 26px 20px 18px 20px; background-color: #FFFFFF; border-bottom: 1px solid #F4F0EB; text-align: center;">
              <h1 class="brand-title" style="font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 24px; font-weight: 700; letter-spacing: 3px; color: #802B3E; margin: 0; text-transform: uppercase; line-height: 1.2;">KISEKAE</h1>
              <div class="brand-tagline" style="font-size: 11px; letter-spacing: 1.5px; color: #78716C; text-transform: uppercase; margin-top: 5px; font-weight: 500;">Fashion, before it's yours</div>
            </td>
          </tr>
          <!-- Main Content -->
          <tr>
            <td class="email-content-td" style="padding: 26px 20px; word-break: break-word; overflow-wrap: break-word; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.6; color: #2D2527;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td align="center" class="email-footer-td" style="padding: 18px 20px; background-color: #FAF8F5; border-top: 1px solid #E7E2DA; text-align: center; font-size: 11px; line-height: 1.5; color: #78716C;">
              <p style="margin: 0 0 4px 0; font-weight: 600;">KISEKAE Augmented Reality Fashion Store</p>
              <p style="margin: 0; font-size: 11px; color: #78716C;">You received this email because of your account activity on Kisekae.</p>
            </td>
          </tr>
        </table>
        <!--[if (gte mso 9)|(IE)]>
        </td>
        </tr>
        </table>
        <![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
