<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}KISEKAE{% endblock %}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F4F0EB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #2D2527;
      line-height: 1.6;
    }
    .wrapper {
      width: 100%;
      background-color: #F4F0EB;
      padding: 40px 15px;
      box-sizing: border-box;
    }
    .container {
      max-width: 580px;
      margin: 0 auto;
      background-color: #FFFFFF;
      border-radius: 14px;
      border: 1px solid #E7E2DA;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(45, 37, 39, 0.05);
    }
    .header {
      padding: 32px 30px 24px 30px;
      text-align: center;
      background-color: #FFFFFF;
      border-bottom: 1px solid #F4F0EB;
    }
    .brand-title {
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 4px;
      color: #802B3E;
      margin: 0;
      text-transform: uppercase;
    }
    .brand-tagline {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #78716C;
      text-transform: uppercase;
      margin-top: 6px;
    }
    .content {
      padding: 32px 30px;
    }
    .footer {
      padding: 24px 30px;
      background-color: #FAF8F5;
      border-top: 1px solid #E7E2DA;
      text-align: center;
      font-size: 12px;
      color: #78716C;
    }
    .footer a {
      color: #802B3E;
      text-decoration: none;
    }
    .btn {
      display: inline-block;
      background-color: #802B3E;
      color: #FFFFFF !important;
      padding: 13px 26px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      letter-spacing: 0.5px;
      margin-top: 15px;
      margin-bottom: 15px;
    }
    .badge {
      display: inline-block;
      background-color: #F9F4F5;
      color: #802B3E;
      border: 1px solid #EBD5D9;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .item-table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    .item-table th {
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #78716C;
      padding-bottom: 8px;
      border-bottom: 1px solid #E7E2DA;
    }
    .item-table td {
      padding: 12px 0;
      border-bottom: 1px solid #F4F0EB;
      font-size: 14px;
    }
    .info-card {
      background-color: #FAF8F5;
      border: 1px solid #EDE8E3;
      border-radius: 8px;
      padding: 16px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <div class="header">
        <h1 class="brand-title">KISEKAE</h1>
        <div class="brand-tagline">Fashion, before it's yours</div>
      </div>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
      <div class="footer">
        <p style="margin: 0 0 6px 0;">KISEKAE Augmented Reality Fashion Store</p>
        <p style="margin: 0; font-size: 11px; color: #A8A29E;">You received this email because of your account activity on Kisekae.</p>
      </div>
    </div>
  </div>
</body>
</html>
