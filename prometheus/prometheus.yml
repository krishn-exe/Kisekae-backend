global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'django'
    metrics_path: '/metrics'
    bearer_token_file: '/run/secrets/prometheus_token'
    scrape_interval: 5s
    static_configs:
      - targets: ['web:8000']

